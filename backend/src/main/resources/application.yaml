server:
  port: ${SERVER_PORT:3000}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: restaurant-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant-management-system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration).
      ddl-auto: none
    properties:
      hibernate:
        auto_quote_keyword: true
        format_sql: false
  flyway:
    enabled: true
    # Databases created before migrations existed already hold the V1 schema: mark it as applied and upgrade from there.
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret-key: ${JWT_SECRET_KEY:}
  token:
    issuer: restaurant-management-system
    lifetime: 8h

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN:http://localhost:8080}

app:
  # Fills an empty database with demo users, shifts, stock and orders. Each part only runs when its tables are empty.
  seed: ${SEED_DEMO_DATA:true}

logging:
  level:
    root: INFO
    be.ucll.se.courses.backend: INFO
