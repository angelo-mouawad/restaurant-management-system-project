spring:
  datasource:
    url: jdbc:h2:mem:restaurant-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Tests build the schema from the entities on an in-memory H2 database.
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  seed: false

jwt:
  secret-key: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLXJlc3RhdXJhbnQtc3lzdGVt

logging:
  level:
    root: WARN
